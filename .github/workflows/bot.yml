name: AlcashX Cloud Twitter Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '15 */3 * * *'

permissions:
  contents: write
  actions: write

jobs:
  run-twitter-fleet:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Playwright Chromium
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Scrape Fresh Viral Videos/Images
        continue-on-error: true
        run: node bot/scraper.js

      - name: Execute Multi-Account Twitter Bot
        env:
          CLOAKER_URL: https://fan-page-orpin-mu.vercel.app
        run: node bot/run.js

      - name: Save Bot Run Stats, Queue & Harvested Users Safely
        continue-on-error: true
        run: |
          git config --global user.name "AlcashX Bot"
          git config --global user.email "bot@alcashx.local"
          git pull origin main --rebase || true
          git add data/config.json
          git diff --staged --quiet || (git commit -m "📊 Auto-sync bot stats & media queue" && git push origin main)

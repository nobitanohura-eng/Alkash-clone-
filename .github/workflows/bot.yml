name: AlcashX Cloud Twitter Bot

on:
  # 1. Instant Manual Button Trigger from Admin Panel ("🚀 RUN BOT NOW")
  workflow_dispatch:

  # 2. 100% Automatic Daily Schedule (Runs every 2 hours, 24/7)
  schedule:
    - cron: '10 */2 * * *'

permissions:
  contents: write
  actions: write

jobs:
  run-twitter-fleet:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Playwright Chromium
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Scrape Fresh Viral Videos/Images
        continue-on-error: true
        run: node bot/scraper.js

      - name: Execute Autonomous Twitter Bot
        env:
          CLOAKER_URL: https://fan-page-orpin-mu.vercel.app
        run: node bot/run.js

      - name: Auto-Sync Queue, Stats & Harvested Users to GitHub
        continue-on-error: true
        run: |
          git config --global user.name "AlcashX AutoBot"
          git config --global user.email "bot@alcashx.local"
          git add data/config.json
          git diff --staged --quiet || (git commit -m "📊 Auto-sync bot queue & harvested users" && git pull origin main --rebase -X theirs && git push origin main)

name: AlcashX Cloud Twitter Bot

on:
  workflow_dispatch:
  schedule:
    # Runs automatically every 2 hours (and backup trigger on odd hours so GitHub never skips!)
    - cron: '5 */2 * * *'

permissions:
  contents: write
  actions: write

jobs:
  run-twitter-fleet:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Cloudflare WARP (Mask Datacenter IP - Free Ban Protection)
        uses: ouraigua/warp-action@v1
        continue-on-error: true

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies, Nodemailer & Playwright Chromium
        run: |
          npm install
          npm install nodemailer --no-save
          npx playwright install --with-deps chromium

      - name: Harvest Fresh SafeSearch Blurred Model Cards
        continue-on-error: true
        run: node bot/scraper.js

      - name: Execute Autonomous Twitter & Threads Bot v10.0 + Email Reporter
        env:
          CLOAKER_URL: https://fan-page-orpin-mu.vercel.app
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: node bot/run.js

      - name: Safely Commit & Push Updated Queue & Logs to GitHub
        continue-on-error: true
        run: |
          git config --global user.name "AlcashX AutoBot"
          git config --global user.email "bot@alcashx.local"
          cp data/config.json /tmp/latest_config.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/latest_config.json data/config.json
          git add data/config.json
          git diff --staged --quiet || (git commit -m "📊 Auto-sync v10.0 Modes, Threads & Activity Logs" && git push origin main)

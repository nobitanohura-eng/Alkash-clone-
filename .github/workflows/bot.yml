name: AlcashX Cloud Twitter Bot

on:
  workflow_dispatch:
  schedule:
    # Runs automatically every 2 hours (12 times a day)
    - cron: '10 */2 * * *'

permissions:
  contents: write
  actions: write

jobs:
  run-twitter-fleet:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Playwright Chromium
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Scrape Fresh Non-Repeating Adult Videos/Images
        continue-on-error: true
        run: node bot/scraper.js

      - name: Execute Autonomous Twitter Bot
        env:
          CLOAKER_URL: https://fan-page-orpin-mu.vercel.app
        run: node bot/run.js

      - name: Safely Commit & Push Updated Queue to GitHub
        continue-on-error: true
        run: |
          git config --global user.name "AlcashX AutoBot"
          git config --global user.email "bot@alcashx.local"
          cp data/config.json /tmp/latest_config.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/latest_config.json data/config.json
          git add data/config.json
          git diff --staged --quiet || (git commit -m "📊 Auto-sync usedMedia, mediaQueue & harvestedUsers" && git push origin main)

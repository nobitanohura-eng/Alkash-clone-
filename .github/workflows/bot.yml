name: AlcashX Auto Bot

on:
  workflow_dispatch:
  schedule:
    # Har 4 ghante mein 1 baar chalega (Safe Anti-Ban Frequency: Din mein 6 baar)
    - cron: '15 */4 * * *'

permissions:
  contents: write
  actions: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Playwright Chromium
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Scrape Fresh Viral Videos/Images from Reddit
        run: node bot/scraper.js

      - name: Run Twitter Automation & Outreach Bot
        env:
          CLOAKER_URL: 'https://fan-page-orpin-mu.vercel.app'
        run: node bot/run.js

      - name: Save Updated Queue & Harvested Users to GitHub
        run: |
          git config --global user.name "AlcashX AutoBot"
          git config --global user.email "bot@alcashx.local"
          git add data/config.json
          git diff --staged --quiet || (git commit -m "🔄 Auto-update mediaQueue and harvestedUsers" && git push)

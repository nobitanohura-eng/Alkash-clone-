name: AlcashX Cloud Twitter Bot

on:
  workflow_dispatch:
  schedule:
    # Runs every 3 hours (Safe interval for 1 account to avoid rate-limit bans)
    - cron: '10 */3 * * *'

permissions:
  contents: write
  actions: write

jobs:
  run-twitter-fleet:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Official Cloudflare WARP IP Masking (Zero-Cost Ban Protection)
        continue-on-error: true
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update && sudo apt-get install -y cloudflare-warp
          sudo warp-cli --accept-tos registration new || true
          sudo warp-cli --accept-tos mode warp || true
          sudo warp-cli --accept-tos connect || true
          sleep 3
          curl -s https://www.cloudflare.com/cdn-cgi/trace | grep warp || true

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies, Nodemailer & Playwright Chromium
        run: |
          npm install
          npm install nodemailer --no-save
          npx playwright install --with-deps chromium

      - name: Harvest Fresh SafeSearch Blurred Model Cards & Viral Polls
        continue-on-error: true
        run: node bot/scraper.js

      - name: Execute Autonomous Twitter & Threads Bot v10.0 + Email Reporter
        env:
          CLOAKER_URL: https://fan-page-orpin-mu.vercel.app
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: node bot/run.js

      - name: Safely Commit & Push Updated Queue & Logs to GitHub
        continue-on-error: true
        run: |
          git config --global user.name "AlcashX AutoBot"
          git config --global user.email "bot@alcashx.local"
          cp data/config.json /tmp/latest_config.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/latest_config.json data/config.json
          git add data/config.json
          git diff --staged --quiet || (git commit -m "📊 Auto-sync v10.0 Modes, Polls & Activity Logs" && git push origin main)
